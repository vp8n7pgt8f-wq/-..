<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기말 트래커</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="기말 트래커">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}</style>
</head><body>
<style>
/* Layout: iOS 설정 앱처럼 묶음 목록(inset grouped) + 아래 탭 바. 오늘 / 일정 / 공부법 세 화면. */
:root {
  --bg: #f2f2f7; --cell: #ffffff; --label: #000000; --sub: rgba(60,60,67,.62); --sep: rgba(60,60,67,.22); --fill: rgba(120,120,128,.14);
  --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --purple: #af52de; --teal: #30b0c7;
  --indigo: #5856d6; --pink: #ff2d55; --brown: #a2845e; --gray: #8e8e93; --bar: rgba(249,249,249,.94); --sea1: #f1fbfa; --sea2: #d9ecff; --bub: rgba(60,130,200,.35); --gold: #f5b800;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --cell: #1c1c1e; --label: #ffffff; --sub: rgba(235,235,245,.6); --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24);
  --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2; --teal: #40c8e0;
  --indigo: #5e5ce6; --pink: #ff375f; --brown: #ac8e68; --gray: #98989d; --bar: rgba(22,22,24,.92); --sea1: #15304f; --sea2: #0a1626; --bub: rgba(180,220,255,.35); --gold: #ffcc1a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --cell: #1c1c1e; --label: #ffffff; --sub: rgba(235,235,245,.6); --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24);
  --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2; --teal: #40c8e0;
  --indigo: #5e5ce6; --pink: #ff375f; --brown: #ac8e68; --gray: #98989d; --bar: rgba(22,22,24,.92); --sea1: #15304f; --sea2: #0a1626; --bub: rgba(180,220,255,.35); --gold: #ffcc1a;
  color-scheme: dark }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 17px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
.page { max-width: 600px; margin: 0 auto; padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.large { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 8px 4px 2px; }
.caption { font-size: 15px; color: var(--sub); margin: 0 4px 16px; font-variant-numeric: tabular-nums; }
.caption b { color: var(--blue); font-weight: 600; }
.group-h { font-size: 13px; color: var(--sub); text-transform: none; margin: 22px 16px 7px; display: flex; justify-content: space-between; gap: 8px; }
.group { background: var(--cell); border-radius: 12px; overflow: hidden; }
.group-f { font-size: 13px; color: var(--sub); margin: 7px 16px 0; line-height: 1.4; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 44px; box-sizing: border-box; position: relative; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 52px; border-top: .5px solid var(--sep); }
.group.plain .row + .row::before { left: 16px; }
button.row { cursor: pointer; }
button.row:active, label.row:active { background: var(--fill); }
.row:focus-visible, .tab:focus-visible, .pager button:focus-visible, .seg button:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.grow { flex: 1; min-width: 0; }
.t { font-size: 17px; }
.s { font-size: 13px; color: var(--sub); margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.must { font-size: 12px; font-weight: 600; color: var(--orange); }
/* checkbox */
label.row { cursor: pointer; align-items: flex-start; }
label.row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ck { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--gray); flex: none; display: grid; place-items: center; margin-top: 1px; box-sizing: border-box; transition: background .15s, border-color .15s; }
.ck svg { width: 14px; height: 14px; opacity: 0; }
label.row input:checked + .ck { background: var(--green); border-color: var(--green); }
label.row input:checked + .ck svg { opacity: 1; }
label.row input:focus-visible + .ck { outline: 2px solid var(--blue); outline-offset: 2px; }
label.row input:checked ~ .grow .t { color: var(--sub); text-decoration: line-through; }
/* pager */
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 0; }
.pager button { background: none; border: 0; color: var(--blue); font: inherit; font-size: 28px; line-height: 1; padding: 6px 12px; cursor: pointer; border-radius: 8px; }
.pager button:disabled { color: var(--gray); opacity: .4; cursor: default; }
.pager .mid { text-align: center; }
.pager .mid .large { margin: 0; font-size: 30px; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--blue); color: #fff; white-space: nowrap; }
.pill.gray { background: var(--fill); color: var(--sub); }
.pill.red { background: var(--red); }
.prog { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; margin: 12px 4px 0; }
.prog i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width .25s; }
.today-btn { background: var(--fill); color: var(--blue); border: 0; font: inherit; font-size: 15px; font-weight: 600; padding: 6px 14px; border-radius: 99px; cursor: pointer; }
.center { text-align: center; margin-top: 10px; }
/* schedule rows */
.cnt { font-size: 15px; color: var(--sub); font-variant-numeric: tabular-nums; }
.cnt.full { color: var(--green); font-weight: 600; }
.chev { color: var(--gray); opacity: .6; font-size: 20px; line-height: 1; }
.ring { width: 28px; height: 28px; flex: none; }
.num { width: 22px; height: 22px; border-radius: 50%; background: var(--fill); color: var(--sub); font-size: 13px; font-weight: 600; display: grid; place-items: center; flex: none; }
input.text { font: inherit; border: 0; background: transparent; color: var(--label); width: 100%; padding: 0; outline: none; }
input.text::placeholder { color: var(--gray); }
/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: .5px solid var(--sep); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { flex: 1; max-width: 200px; background: none; border: 0; font: inherit; font-size: 10px; font-weight: 500; color: var(--gray); display: grid; justify-items: center; gap: 2px; padding: 7px 0 6px; cursor: pointer; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-selected="true"] { color: var(--blue); }
.net { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; padding: 12px 16px; min-height: 44px; box-sizing: border-box; }
.net svg { display: block; }
.net .lbl { width: 100%; display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); }
.net .lbl b { color: var(--blue); font-weight: 600; }
.full-net { color: var(--gold) !important; }
.fish-new { animation: jump .6s ease-out; }
@keyframes jump { 0% { transform: translateY(14px) rotate(20deg); opacity: 0; } 60% { transform: translateY(-6px) rotate(-8deg); opacity: 1; } 100% { transform: none; } }
.sea { border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, var(--sea1), var(--sea2)); position: relative; aspect-ratio: 220 / 150; max-width: 100%; display: grid; place-items: center; }
.sea .big { height: auto; filter: drop-shadow(0 6px 8px rgba(10,40,70,.18)); }
.sea .bob { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.sea .bub { position: absolute; border-radius: 50%; border: 1.5px solid var(--bub); animation: rise 6s linear infinite; bottom: -10px; }
@keyframes rise { to { transform: translateY(-260px); opacity: 0; } }
.stage { text-align: center; margin-top: 14px; }
.stage .nm { font-size: 22px; font-weight: 700; }
.stage .rk { font-size: 15px; color: var(--sub); margin-top: 2px; }
.log { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; padding: 12px; }
.log .d { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; padding: 6px 0; border-radius: 10px; }
.log .d.today { background: var(--fill); color: var(--label); font-weight: 600; }
.log .d img { max-width: 100%; }
@media (prefers-reduced-motion: reduce) { .fish-new, .sea .bob, .sea .bub { animation: none; } .sea .bub { display: none; } }
.status { font-size: 12px; color: var(--sub); text-align: center; margin-top: 24px; }
@media (prefers-reduced-motion: reduce) { .prog i, .ck { transition: none; } }
</style>

<main class="page" id="app"></main>

<nav class="tabbar" role="tablist">
  <button class="tab" role="tab" data-tab="today" id="tab-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>오늘</button>
  <button class="tab" role="tab" data-tab="plan" id="tab-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>일정</button>
  <button class="tab" role="tab" data-tab="how" id="tab-how"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>공부법</button>
  <button class="tab" role="tab" data-tab="sea" id="tab-sea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-5 9-6 13-2l5-4v12l-5-4c-4 4-10 3-13-2z"/><circle cx="7.5" cy="11" r=".6" fill="currentColor"/></svg>어장</button>
</nav>

<script>
// 사실적인 물고기 일러스트 (원본 SVG). 단계마다 배경 장식이 다름.
function rnd(seed) { let x = seed; return () => (x = (x * 16807) % 2147483647) / 2147483647; }
function finPaths(list, id, color, edge) {
  return list.map((d, i) => `<path d="${d}" fill="${color}" stroke="${edge}" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="${d}" fill="url(#${id}ray${i % 2})" opacity=".55"/>`).join("");
}
function realFish(id, o) {
  const back = o.backFins || [], front = o.frontFins || [];
  return `<defs>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">${o.grad.map((c, i) => `<stop offset="${(i / (o.grad.length - 1)).toFixed(2)}" stop-color="${c}"/>`).join("")}</linearGradient>
    <linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".3"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="${id}s" cx=".7" cy=".35" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="${id}sc" width="7" height="6" patternUnits="userSpaceOnUse"><path d="M0 6a3.5 3.5 0 0 1 7 0M-3.5 3a3.5 3.5 0 0 1 7 0M3.5 3a3.5 3.5 0 0 1 7 0" fill="none" stroke="${o.scale || "rgba(0,0,0,.18)"}" stroke-width=".7"/></pattern>
    <pattern id="${id}ray0" width="3.2" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(${o.rayA || 20})"><line x1="0" y1="0" x2="0" y2="10" stroke="${o.ray}" stroke-width=".8"/></pattern>
    <pattern id="${id}ray1" width="3.2" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(${-(o.rayA || 20)})"><line x1="0" y1="0" x2="0" y2="10" stroke="${o.ray}" stroke-width=".8"/></pattern>
    <clipPath id="${id}c"><path d="${o.body}"/></clipPath>
    <filter id="${id}sh" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0b2540" flood-opacity=".22"/></filter>
  </defs>
  <g filter="url(#${id}sh)">
    ${finPaths([o.tail, ...back], id, o.fin, o.finEdge)}
    <path d="${o.body}" fill="url(#${id}g)"/>
    <g clip-path="url(#${id}c)">
      ${o.noScale ? "" : `<rect x="0" y="0" width="220" height="144" fill="url(#${id}sc)"/>`}
      ${o.marks || ""}
      <rect x="0" y="0" width="220" height="144" fill="url(#${id}h)"/>
      <rect x="0" y="0" width="220" height="144" fill="url(#${id}s)"/>
    </g>
    <path d="${o.body}" fill="none" stroke="${o.edge}" stroke-width="1" opacity=".6"/>
    ${o.gill ? `<path d="${o.gill}" fill="none" stroke="${o.edge}" stroke-width="1.3" opacity=".55" stroke-linecap="round"/>` : ""}
    ${o.mouth ? `<path d="${o.mouth}" fill="none" stroke="${o.edge}" stroke-width="1.2" opacity=".7" stroke-linecap="round"/>` : ""}
    ${finPaths(front, id, o.fin, o.finEdge)}
    ${o.extra || ""}
    <circle cx="${o.eye[0]}" cy="${o.eye[1]}" r="${o.eye[2]}" fill="${o.iris || "#d9c27a"}"/>
    <circle cx="${o.eye[0] + .3}" cy="${o.eye[1]}" r="${o.eye[2] * .62}" fill="#0c0f16"/>
    <circle cx="${o.eye[0] + o.eye[2] * .3}" cy="${o.eye[1] - o.eye[2] * .35}" r="${o.eye[2] * .22}" fill="#fff" opacity=".9"/>
  </g>`;
}
const FISH = {
  fry: id => realFish(id, {
    body: "M60 72C76 63 124 59 158 66C168 68 173 71 173 73C167 78 140 83 110 84C86 84 70 80 60 72Z",
    tail: "M64 72L42 62C44 66 45 69 45 72C45 75 44 78 42 82Z", backFins: ["M108 61C112 56 120 55 126 60Z"],
    grad: ["rgba(150,190,205,.85)", "rgba(215,235,242,.8)", "rgba(245,250,252,.9)"], fin: "rgba(220,238,245,.55)", finEdge: "rgba(120,160,175,.6)", ray: "rgba(120,160,175,.6)",
    edge: "#6f9aaa", noScale: true, eye: [160, 69, 4.2], iris: "#b8c6c9",
    marks: `<path d="M66 72C90 72 130 71 156 70" stroke="rgba(90,120,135,.45)" stroke-width="1.2" fill="none"/><ellipse cx="140" cy="76" rx="6" ry="4" fill="rgba(240,190,120,.55)"/>`
  }),
  clown: id => realFish(id, {
    body: "M42 72C50 48 92 39 130 42C160 46 182 58 186 72C182 88 160 100 130 102C92 104 52 96 42 72Z",
    tail: "M46 72C32 58 20 54 10 57C7 66 7 78 10 88C20 91 32 86 46 72Z",
    backFins: ["M70 47C78 32 98 29 110 40C120 30 142 31 152 47Z", "M100 100C108 116 130 120 142 98Z", "M122 98C120 112 112 118 104 121C110 110 112 104 112 98Z"],
    frontFins: ["M140 76C128 84 120 92 118 100C130 96 140 88 146 80Z"],
    grad: ["#f2700f", "#ff7a14", "#ff9a3c"], fin: "#ff7f1a", finEdge: "#1b1209", ray: "rgba(120,40,0,.35)", edge: "#8a3a05",
    scale: "rgba(140,50,0,.16)", eye: [165, 64, 5], iris: "#ff9a2a", gill: "M150 52C143 66 143 82 151 96", mouth: "M184 72C181 74 178 75 175 75",
    marks: `<g fill="none" stroke-linecap="round"><path d="M150 36C140 58 140 86 150 108" stroke="#111" stroke-width="15"/><path d="M150 36C140 58 140 86 150 108" stroke="#fbfbf6" stroke-width="11"/>
      <path d="M100 34C114 58 114 86 100 110" stroke="#111" stroke-width="15"/><path d="M100 34C114 58 114 86 100 110" stroke="#fbfbf6" stroke-width="11"/>
      <path d="M52 52C48 64 48 80 52 92" stroke="#111" stroke-width="10"/><path d="M52 52C48 64 48 80 52 92" stroke="#fbfbf6" stroke-width="6"/></g>`
  }),
  mackerel: id => {
    const R = rnd(5); let bars = "";
    for (let x = 40; x < 160; x += 9) bars += `<path d="M${x} ${52 + R() * 4}q${4 + R() * 3} ${6 + R() * 3} ${-1 + R() * 3} ${12 + R() * 4}" stroke="#102c33" stroke-width="${2.4 + R()}" fill="none" stroke-linecap="round" opacity=".8"/>`;
    const finlets = [44, 52, 60, 68].map(x => `<path d="M${x} ${60 + (x - 44) * -.15}l4-5l2 5Z M${x} ${88 + (x - 44) * .1}l4 5l2-5Z" fill="#c9b04a" opacity=".85"/>`).join("");
    return realFish(id, {
      body: "M28 74C52 54 118 46 168 58C184 62 194 68 196 74C190 82 172 90 122 94C80 96 50 90 28 74Z",
      tail: "M34 74C24 62 16 50 6 40C14 56 18 66 20 74C18 82 14 92 6 108C16 98 24 86 34 74Z",
      backFins: ["M118 51L126 33L141 53Z", "M78 54L84 44L95 54Z", "M80 92L86 102L97 92Z"], frontFins: ["M152 75C142 77 133 81 127 87C137 85 147 81 154 78Z"],
      grad: ["#1f5a63", "#3f8a92", "#a9c9cf", "#eef3f5", "#f7f9fa"], fin: "#4d7f88", finEdge: "#163e45", ray: "rgba(10,40,45,.4)", edge: "#163e45",
      scale: "rgba(10,40,45,.1)", eye: [178, 68, 5.2], iris: "#c9cfd2", gill: "M164 61C157 69 157 81 163 88", mouth: "M196 74C192 76 188 77 184 77",
      marks: `${bars}<rect x="0" y="68" width="220" height="40" fill="#eef3f5" opacity=".6"/><path d="M34 73C80 70 130 66 170 66" stroke="#6a8f96" stroke-width="1" fill="none"/>`,
      extra: finlets
    });
  },
  amberjack: id => realFish(id, {
    body: "M26 74C48 50 120 40 172 54C188 59 196 66 198 74C192 84 172 96 120 100C76 102 46 94 26 74Z",
    tail: "M32 74C22 60 14 46 2 34C12 52 16 64 18 74C16 84 12 96 2 114C14 102 22 88 32 74Z",
    backFins: ["M58 55C78 45 108 42 128 48L124 54Z", "M136 49L144 38L152 52Z", "M66 94C82 102 102 104 114 99Z"], frontFins: ["M158 78C146 80 136 84 130 90C142 88 152 84 160 81Z"],
    grad: ["#3c5f8f", "#6f8fb8", "#c4d0dd", "#f1f3f6"], fin: "#c9b25a", finEdge: "#6f6230", ray: "rgba(90,70,20,.35)", edge: "#2f4466",
    scale: "rgba(30,50,80,.1)", eye: [182, 66, 5.4], iris: "#d8d2b8", gill: "M168 56C160 66 160 82 167 92", mouth: "M198 74C194 76 190 77 186 77",
    marks: `<path d="M196 70C150 70 92 72 30 74" stroke="#f0c43c" stroke-width="4.5" fill="none" opacity=".9"/><path d="M178 52L190 70" stroke="#2a3550" stroke-width="3.5" stroke-linecap="round" opacity=".75"/>`
  }),
  tuna: id => {
    const finlets = [40, 48, 56, 64, 72].map(x => `<path d="M${x} ${57 - (72 - x) * .05}l4-6l2 6Z M${x} ${92 + (72 - x) * .05}l4 6l2-6Z" fill="#f2c230" stroke="#6b5310" stroke-width=".6"/>`).join("");
    return realFish(id, {
      body: "M22 74C46 44 128 36 182 58C194 63 200 69 200 74C194 84 172 100 124 104C76 106 44 96 22 74Z",
      tail: "M28 74C22 60 14 42 4 22C11 24 19 38 26 54C30 62 32 69 32 74C32 79 30 86 26 94C19 110 11 124 4 126C14 106 22 88 28 74Z",
      backFins: ["M118 45L130 27L144 49Z", "M90 47C94 33 100 22 107 15C107 28 106 38 106 49Z", "M90 101C94 115 100 126 107 133C107 120 106 110 106 99Z"],
      frontFins: ["M150 77C130 81 110 85 94 87C112 89 132 87 152 81Z"],
      grad: ["#0d1a45", "#1f3a7a", "#7f97c0", "#e6ebf3", "#f5f7fa"], fin: "#1a2c63", finEdge: "#0b1638", ray: "rgba(200,210,240,.25)", edge: "#0b1638",
      scale: "rgba(255,255,255,.06)", eye: [180, 66, 5.4], iris: "#c8ccd6", gill: "M164 57C155 68 155 84 163 94", mouth: "M200 74C196 76 192 77 188 77",
      marks: `<path d="M30 70C80 64 140 60 186 64" stroke="#7fa6d6" stroke-width="3" fill="none" opacity=".45"/>`,
      extra: finlets
    });
  },
  whale: id => {

  const mustDone = must.filter(([, i]) => s.done && s.done[i]).length;
  let h = `<div class="pager">
      <button id="prev" aria-label="이전 날"${idx === 0 ? " disabled" : ""}>‹</button>
      <div class="mid"><div class="large">${md(day.d)} ${WD[day.w]}</div>
        <div class="s" style="justify-content:center;margin-top:4px">${isToday ? '<span class="pill">오늘</span>' : ""}${day.ex ? `<span class="pill gray">${esc(day.ex)}</span>` : ""}${day.exam ? '<span class="pill red">기말고사</span>' : ""}<span>${dday()}</span></div></div>
      <button id="next" aria-label="다음 날"${idx === PLAN.length - 1 ? " disabled" : ""}>›</button>
    </div>
    <div class="prog"><i style="width:${n ? c / n * 100 : 0}%"></i></div>
    <div class="caption" style="margin-top:8px;text-align:center">${c}/${n} 완료${must.length ? ` · 필수 <b>${mustDone}/${must.length}</b>` : ""}</div>`;
  h += `<div class="group"><div class="net"><div class="lbl"><span class="${c === n ? "full-net" : ""}">${c === n ? "만선! 오늘 그물이 꽉 찼어" : "오늘의 그물"}</span><span>${c === n ? "" : `만선까지 <b>${n - c}마리</b>`}</span></div>
    ${c === n ? `<span class="${lastCatch && lastCatch.startsWith(day.d) ? "fish-new" : ""}" style="width:100%;display:flex;justify-content:center">${spr("goldfish", 84)}</span>` : ""}
    ${day.t.map((t, i) => { const got = s.done && s.done[i]; const big = !!t[3];
      return `<span class="${got && lastCatch === day.d + "-" + i ? "fish-new" : ""}" title="${esc(SUBJ[t[1]].n)}">${got ? spr(big ? "daily_yellow" : "daily_blue", big ? 28 : 22) : spr("daily_blue", 22, "filter:grayscale(1);opacity:.22")}</span>`; }).join("")}
  </div></div>`;
  if (!isToday) h += `<div class="center"><button class="today-btn" id="goToday">오늘로</button></div>`;
  if (day.exam) h += `<div class="group-h">이날 시험 과목</div><div class="group plain"><div class="row">
      <input class="text" id="note-${day.d}" data-d="${day.d}" placeholder="예: 미적분, 화학" value="${esc(s.note || "")}" aria-label="이날 시험 과목"></div></div>`;
  if (must.length) h += `<div class="group-h"><span>★ 필수</span><span>이것만 해도 오늘은 성공</span></div>
    <div class="group">${must.map(([t, i]) => taskRow(day, t, i)).join("")}</div>`;
  if (rest.length) h += `<div class="group-h"><span>더 하면 좋은 것</span><span>시간 없으면 아래부터 버려</span></div>
    <div class="group">${rest.map(([t, i]) => taskRow(day, t, i)).join("")}</div>`;
  h += `<div class="status">${esc(statusText)}</div>`;
  return h;
}

function viewPlan() {
  const [c, n] = totals(), today = todayStr();
  let h = `<div class="large">일정</div><div class="caption">${dday()} · 전체 <b>${n ? Math.round(c / n * 100) : 0}%</b> (${c}/${n})</div>`;
  let open = false;
  PLAN.forEach(day => {
    if (day.ph) { if (open) h += `</div>`; h += `<div class="group-h">${esc(day.ph)}</div><div class="group">`; open = true; }
    const [a, b] = count(day), s = st(day.d);
    const subs = [...new Set(day.t.filter(t => t[3]).map(t => SUBJ[t[1]].n))].join(" · ");
    const sub = day.exam ? (s.note ? "시험: " + s.note : "시험 과목 적기") : (subs ? "필수: " + subs : "");
    h += `<button class="row" data-go="${day.d}">${ring(a, b)}
      <span class="grow"><span class="t">${md(day.d)} ${day.w}${day.d === today ? ' <span class="pill">오늘</span>' : ""}${day.ex ? ` <span class="pill gray">${esc(day.ex)}</span>` : ""}</span>
      <span class="s">${esc(sub)}</span></span>
      <span class="cnt${a === b ? " full" : ""}">${a}/${b}</span><span class="chev">›</span></button>`;
  });
  if (open) h += `</div>`;
  h += `<div class="group-f">못 한 칸은 일요일 점검 때 다음 주로 옮기면 돼.</div>`;
  return h;
}

function viewHow() {
  let h = `<div class="large">공부법</div><div class="caption">과목별 자료 순서와 버릴 것</div>`;
  HOW.forEach(([k, src, steps, note]) => {
    const sj = SUBJ[k];
    h += `<div class="group-h"><span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:${sj.c}"></span>${sj.n}</span><span>${esc(src)}</span></div>
      <div class="group">${steps.map((x, i) => `<div class="row"><span class="num">${i + 1}</span><span class="grow t">${esc(x)}</span></div>`).join("")}</div>
      <div class="group-f">${esc(note)}</div>`;
  });
  return h;
}

let lastCatch = null;
function fish(w, color, outline) {
  const st = outline ? `fill="none" stroke="var(--gray)" stroke-width="1.6" stroke-dasharray="3 2.5" opacity=".7"` : `fill="${color}"`;
  return `<svg width="${w}" height="${(w * 0.6).toFixed(1)}" viewBox="0 0 40 24" aria-hidden="true">
    <path d="M3 12C9 2.5 24 2.5 31 12 24 21.5 9 21.5 3 12Z" ${st}/><path d="M30 12 39 4.5 37 12 39 19.5Z" ${st}/>
    ${outline ? "" : '<circle cx="10.5" cy="10.2" r="2" fill="#fff"/><circle cx="10.2" cy="10.2" r="1" fill="#111"/><path d="M17 6.5q2.5 5.5 0 11" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.4"/>'}</svg>`;
}
const STAGES = [
  [0, "물고기 알", "견습 어부", "egg", 34, 0],
  [5, "치어", "초보 어부", "fry", 46, 1],
  [20, "꼬마 물고기", "어부", "small", 52, 5],
  [45, "흰동가리", "숙련 어부", "clown", 60, 2],
  [70, "참치", "선장", "tuna", 82, 3],
  [100, "전설의 고래", "전설의 선장", "whale", 90, 6]
];
function spr(name, h, st) { return `<img src="${SPR[name]}" alt="" style="height:${h}px;width:auto;display:block;${st || ""}">`; }
function stageOf(pct) { let k = 0; STAGES.forEach((x, i) => { if (pct >= x[0]) k = i; }); return k; }
function viewSea() {
  const [c, n] = totals(), pct = n ? Math.floor(c / n * 100) : 0, k = stageOf(pct), S = STAGES[k], nx = STAGES[k + 1];
  const need = nx ? Math.max(0, Math.ceil(nx[0] / 100 * n) - c) : 0;
  const bubbles = [12, 30, 55, 78, 88].map((x, i) => `<span class="bub" style="left:${x}%;width:${6 + i % 3 * 4}px;height:${6 + i % 3 * 4}px;animation-delay:${i * 1.2}s"></span>`).join("");
  const big = `<svg viewBox="0 0 220 144" style="position:absolute;inset:0;width:100%;height:100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${deco(S[5])}</svg>
    <img class="big bob" src="${SPR[S[3]]}" alt="" style="width:${S[4]}%;max-width:none;position:relative">`;
  let h = `<div class="large">어장</div><div class="caption">할 일 하나 = 물고기 밥 한 번. 전부 채우면 전설의 고래가 돼.</div>
    <div class="sea" role="img" aria-label="${esc(S[1])}">${bubbles}${big}</div>
    <div class="stage"><div class="nm">${esc(S[1])}</div><div class="rk">${esc(S[2])} · 전체 ${pct}% (${c}/${n})</div></div>
    <div class="prog"><i style="width:${pct}%;background:${k === 6 ? "var(--gold)" : "var(--blue)"}"></i></div>
    <div class="caption" style="text-align:center;margin-top:8px">${nx ? `다음 단계 <b>${esc(nx[1])}</b>까지 ${need}개` : "완전히 다 컸어. 수고했어, 선장님."}</div>
    <div class="group-h"><span>어획 기록</span><span>금붕어 = 만선 · 노랑 = 필수 완료</span></div><div class="group"><div class="log">`;
  const today = todayStr();
  PLAN.forEach(day => {
    const [a, b] = count(day), s = st(day.d);
    const must = day.t.map((t, i) => [t, i]).filter(([t]) => t[3]);
    const mustAll = must.length && must.every(([, i]) => s.done && s.done[i]);
    const icon = a === b ? spr("goldfish", 30) : mustAll ? spr("daily_yellow", 24) : a > 0 ? spr("daily_blue", 22) : spr("daily_blue", 22, "filter:grayscale(1);opacity:.2");
    h += `<button class="d${day.d === today ? " today" : ""}" data-go="${day.d}" style="border:0;background:${day.d === today ? "var(--fill)" : "none"};font:inherit;cursor:pointer;color:inherit">${icon}<span>${md(day.d)}</span></button>`;
  });
  h += `</div></div><div class="group-f">날짜를 누르면 그날 할 일로 가.</div>`;
  return h;
}
function render() {
  const v = ui.tab === "plan" ? viewPlan() : ui.tab === "how" ? viewHow() : ui.tab === "sea" ? viewSea() : viewToday();
  $app.innerHTML = v;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === ui.tab ? "true" : "false"));
}
function go(tab, day) { ui.tab = tab; if (day) ui.day = day; saveUI(); render(); window.scrollTo(0, 0); }

document.querySelector(".tabbar").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) go(b.dataset.tab, b.dataset.tab === "today" ? (ui.tab === "today" ? defaultDay() : ui.day) : null); });
$app.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return go("today", g.dataset.go);
  const idx = PLAN.findIndex(p => p.d === ui.day);
  if (e.target.closest("#prev") && idx > 0) return go("today", PLAN[idx - 1].d);
  if (e.target.closest("#next") && idx < PLAN.length - 1) return go("today", PLAN[idx + 1].d);
  if (e.target.closest("#goToday")) return go("today", defaultDay());
});
$app.addEventListener("change", e => {
  const el = e.target, d = el.dataset.d; if (!d) return;
  state[d] = state[d] || { done: {} }; state[d].done = state[d].done || {};
  if (el.type === "checkbox") { if (el.checked) { state[d].done[el.dataset.i] = true; lastCatch = d + "-" + el.dataset.i; } else delete state[d].done[el.dataset.i]; }
  else state[d].note = el.value.trim();
  render(); lastCatch = null; persist(d);
});

async function persist(d) {
  saveLocal();
  if (!db) return;
  try { await db.doc("progress/" + d).set({ done: state[d].done || {}, note: state[d].note || "" }); }
  catch (e) { statusText = "이 기기에만 저장됨 (서버 저장 실패)"; }
}

render();

(async () => {
  if (!(window.claude && window.claude.use)) return;
  try {
    db = await window.claude.use("db");
    if (!db) return;
    const snap = await db.collection("progress").get();
    snap.docs.forEach(doc => { const v = doc.data() || {}; state[doc.id] = { done: v.done || {}, note: v.note || "" }; });
    saveLocal(); statusText = "체크는 자동 저장돼. 어느 기기에서 열어도 같아."; render();
  } catch (e) { db = null; }
})();
</script>

</body></html>
